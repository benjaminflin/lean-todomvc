name = "lean-todomvc"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanTodomvc"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = false
weak.linter.style.header = false
weak.linter.style.longLine = false
weak.linter.unusedSimpArgs = false
# we deliberately trust the compiler for evaluating concrete runs
weak.linter.style.native = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.37.0-rc1"

[[lean_lib]]
name = "LeanTodomvc"

[[lean_exe]]
name = "todomvc"
root = "Main"
